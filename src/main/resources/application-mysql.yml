spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

# Profile "mysql" dùng cho môi trường gần production: tắt Swagger UI công khai
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
