spring:
  datasource:
    url: jdbc:h2:mem:winmart_wms_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    # Khóa ngẫu nhiên mỗi lần chạy dev; token cũ hết hiệu lực sau khi khởi động lại.
    secret: ${JWT_SECRET:${random.uuid}${random.uuid}}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8080}
